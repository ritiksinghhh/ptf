<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Expense Tracker</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --muted: #94a3b8;
      --text: #e5e7eb;
      --accent: #38bdf8;
      --danger: #f87171;
      --ok: #34d399;
      --border: #1f2937;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      padding: 24px;
    }

    .app {
      max-width: 1024px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(4px);
    }

    h1, h2, h3 { margin: 0 0 12px; }

    .subtle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(12, 1fr);
    }

    .grid > div { grid-column: span 12; }

    @media (min-width: 760px) {
      .span-4 { grid-column: span 4 !important; }
      .span-3 { grid-column: span 3 !important; }
      .span-6 { grid-column: span 6 !important; }
      .span-8 { grid-column: span 8 !important; }
      .span-9 { grid-column: span 9 !important; }
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    input, select, textarea, button {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1220;
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    textarea { min-height: 76px; resize: vertical; }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      background: #0b1220;
      transition: 0.2s ease;
    }

    button.primary {
      background: var(--accent);
      color: #082f49;
      border-color: #0ea5e9;
      font-weight: 600;
    }

    button:hover { filter: brightness(1.08); }

    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
    }

    .kpi {
      background: #0b1220;
      border: 1px solid #233047;
      border-radius: 10px;
      padding: 12px;
    }

    .kpi .label { color: var(--muted); font-size: 0.85rem; }
    .kpi .value { font-size: 1.25rem; font-weight: 700; margin-top: 4px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 0.92rem;
    }

    th, td {
      border-bottom: 1px solid #223047;
      text-align: left;
      padding: 10px 8px;
      vertical-align: top;
    }

    th { color: #cbd5e1; font-weight: 600; }

    .right { text-align: right; }

    .tag {
      display: inline-block;
      border: 1px solid #2d3b55;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.78rem;
      color: #c7d2fe;
      background: rgba(99, 102, 241, 0.15);
    }

    .delete {
      width: auto;
      padding: 6px 10px;
      background: rgba(248, 113, 113, 0.12);
      border-color: rgba(248, 113, 113, 0.35);
      color: #fecaca;
    }

    .empty {
      color: var(--muted);
      padding: 14px;
      border: 1px dashed #334155;
      border-radius: 10px;
      margin-top: 8px;
    }

    .footer-note {
      color: var(--muted);
      font-size: 0.82rem;
      margin-top: 8px;
    }

    .positive { color: var(--ok); }
    .danger { color: var(--danger); }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>🎛️ Studio Expense Tracker</h1>
      <p class="subtle">Track software, gear, rent, utilities, and anything else you spend to run your studio.</p>

      <form id="expense-form" class="grid">
        <div class="span-3">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required />
        </div>

        <div class="span-3">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select category</option>
            <option>Rent</option>
            <option>Utilities</option>
            <option>Gear</option>
            <option>Software</option>
            <option>Repairs</option>
            <option>Marketing</option>
            <option>Travel</option>
            <option>Other</option>
          </select>
        </div>

        <div class="span-3">
          <label for="vendor">Vendor</label>
          <input id="vendor" name="vendor" type="text" placeholder="e.g. Sweetwater" required />
        </div>

        <div class="span-3">
          <label for="amount">Amount (USD)</label>
          <input id="amount" name="amount" type="number" step="0.01" min="0" placeholder="0.00" required />
        </div>

        <div class="span-9">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" placeholder="Optional details about this expense"></textarea>
        </div>

        <div class="span-3">
          <label>&nbsp;</label>
          <button class="primary" type="submit">Add Expense</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Summary</h2>
      <div class="grid">
        <div class="span-4">
          <label for="month-filter">Filter by month</label>
          <input id="month-filter" type="month" />
        </div>
        <div class="span-8 actions" style="align-items:end;">
          <button id="clear-filter" type="button">Show All</button>
          <button id="export-csv" type="button">Export CSV</button>
          <button id="clear-all" type="button" class="danger">Delete All Expenses</button>
        </div>
      </div>

      <div class="kpis" style="margin-top:12px;">
        <article class="kpi">
          <div class="label">Total Spend</div>
          <div id="total-spend" class="value">$0.00</div>
        </article>
        <article class="kpi">
          <div class="label">This Month</div>
          <div id="month-spend" class="value">$0.00</div>
        </article>
        <article class="kpi">
          <div class="label">Average Expense</div>
          <div id="avg-spend" class="value">$0.00</div>
        </article>
        <article class="kpi">
          <div class="label">Largest Expense</div>
          <div id="max-spend" class="value">$0.00</div>
        </article>
      </div>
    </section>

    <section class="card">
      <h2>Expense Log</h2>
      <div id="table-wrap"></div>
      <p class="footer-note">Data is saved in your browser (localStorage), so it stays after refresh.</p>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'studio-expenses-v1';

    const form = document.getElementById('expense-form');
    const monthFilter = document.getElementById('month-filter');
    const clearFilterBtn = document.getElementById('clear-filter');
    const exportBtn = document.getElementById('export-csv');
    const clearAllBtn = document.getElementById('clear-all');
    const tableWrap = document.getElementById('table-wrap');

    const totalSpendEl = document.getElementById('total-spend');
    const monthSpendEl = document.getElementById('month-spend');
    const avgSpendEl = document.getElementById('avg-spend');
    const maxSpendEl = document.getElementById('max-spend');

    const currency = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });

    const today = new Date();
    document.getElementById('date').valueAsDate = today;

    function loadExpenses() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveExpenses(expenses) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
    }

    function getActiveMonth() {
      return monthFilter.value || null;
    }

    function filterExpenses(expenses) {
      const month = getActiveMonth();
      if (!month) return expenses;
      return expenses.filter((e) => e.date.startsWith(month));
    }

    function computeSummary(expenses) {
      const total = expenses.reduce((sum, e) => sum + e.amount, 0);
      const avg = expenses.length ? total / expenses.length : 0;
      const max = expenses.length ? Math.max(...expenses.map((e) => e.amount)) : 0;

      const currentMonth = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
      const monthTotal = expenses
        .filter((e) => e.date.startsWith(currentMonth))
        .reduce((sum, e) => sum + e.amount, 0);

      totalSpendEl.textContent = currency.format(total);
      monthSpendEl.textContent = currency.format(monthTotal);
      avgSpendEl.textContent = currency.format(avg);
      maxSpendEl.textContent = currency.format(max);
    }

    function renderTable(allExpenses) {
      const expenses = filterExpenses(allExpenses)
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date));

      if (!expenses.length) {
        tableWrap.innerHTML = '<div class="empty">No expenses yet for this view.</div>';
        return;
      }

      const rows = expenses
        .map(
          (e) => `
            <tr>
              <td>${e.date}</td>
              <td><span class="tag">${escapeHtml(e.category)}</span></td>
              <td>${escapeHtml(e.vendor)}</td>
              <td>${escapeHtml(e.notes || '-')}</td>
              <td class="right">${currency.format(e.amount)}</td>
              <td class="right"><button class="delete" data-id="${e.id}">Delete</button></td>
            </tr>
          `
        )
        .join('');

      tableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Category</th>
              <th>Vendor</th>
              <th>Notes</th>
              <th class="right">Amount</th>
              <th class="right">Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function refresh() {
      const expenses = loadExpenses();
      computeSummary(expenses);
      renderTable(expenses);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const entry = {
        id: crypto.randomUUID(),
        date: String(data.get('date')),
        category: String(data.get('category')),
        vendor: String(data.get('vendor')).trim(),
        notes: String(data.get('notes')).trim(),
        amount: Number(data.get('amount'))
      };

      if (!entry.date || !entry.category || !entry.vendor || Number.isNaN(entry.amount)) return;

      const expenses = loadExpenses();
      expenses.push(entry);
      saveExpenses(expenses);
      form.reset();
      document.getElementById('date').valueAsDate = new Date();
      refresh();
    });

    tableWrap.addEventListener('click', (e) => {
      const btn = e.target.closest('button.delete');
      if (!btn) return;
      const id = btn.dataset.id;
      const next = loadExpenses().filter((item) => item.id !== id);
      saveExpenses(next);
      refresh();
    });

    monthFilter.addEventListener('input', refresh);

    clearFilterBtn.addEventListener('click', () => {
      monthFilter.value = '';
      refresh();
    });

    clearAllBtn.addEventListener('click', () => {
      const ok = confirm('Delete all expenses? This cannot be undone.');
      if (!ok) return;
      saveExpenses([]);
      refresh();
    });

    exportBtn.addEventListener('click', () => {
      const expenses = filterExpenses(loadExpenses());
      if (!expenses.length) return;

      const header = ['date', 'category', 'vendor', 'notes', 'amount'];
      const body = expenses.map((e) => [e.date, e.category, e.vendor, e.notes, e.amount.toFixed(2)]);
      const csv = [header, ...body]
        .map((row) => row.map((cell) => `"${String(cell).replace(/"/g, '""')}"`).join(','))
        .join('\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'studio-expenses.csv';
      a.click();
      URL.revokeObjectURL(url);
    });

    refresh();
  </script>
</body>
</html>
